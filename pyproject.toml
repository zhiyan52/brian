[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"


[project]
name = "ibsr18-3d-unet"
version = "0.1.0"
description = "3D brain MRI tissue segmentation on the IBSR-18 dataset"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }

dependencies = [
    "torch>=2.14,<2.15",
    "torchvision>=0.29,<0.30",
    "monai>=1.6,<1.7",
    "nibabel>=5.3,<6",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "scikit-image>=0.24,<1",
    "pyyaml>=6,<7",
    "tqdm>=4.66,<5",
    "matplotlib>=3.9,<4",
]


[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.12,<1",
    "pre-commit>=4,<5",
]


[tool.setuptools.packages.find]
where = ["src"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]


[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"