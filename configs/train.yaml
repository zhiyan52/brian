seed: 42

data:
  root_dir: "data/raw"
  splits_dir: "data/splits"

  spacing: null

  # Experiment 4: use precomputed N4-corrected MRI images.
  n4_dir: "data/processed/n4"
  use_precomputed_n4: false

  # Runtime N4 is disabled because N4 correction was already
  # performed during preprocessing.
  use_n4_bias_correction: false

  patch_size: [96, 96, 96]

training:
  epochs: 400
  batch_size: 1

  # Use one patch per subject initially because of the
  # GTX 1650 4 GB VRAM constraint.
  num_samples: 1

  learning_rate: 0.0001
  weight_decay: 0.00001

  num_workers: 0
  pin_memory: true

model:
  name: "3d_unet"
  in_channels: 1
  out_channels: 4
  channels: [16, 32, 64, 128, 256]
  strides: [2, 2, 2, 2]
  num_res_units: 2

loss:
  name: "dice_ce"
  dice_weight: 1.0
  ce_weight: 1.0
  include_background: true

# Final baseline: no class weighting.
class_weights: null

inference:
  roi_size: [96, 96, 96]
  sw_batch_size: 1
  overlap: 0.50

output:
  checkpoint_dir: "outputs/checkpoints"
